name: Build OSM extracts

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-extracts
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install osmium-tool
        run: |
          sudo apt-get update -y
          sudo apt-get install -y osmium-tool
          osmium --version

      - name: Build every city listed in cities.json
        run: |
          failed=0
          for slug in $(python3 -c "import json; print(' '.join(json.load(open('cities.json'))))"); do
            echo "=== $slug ==="
            python3 scripts/build_extract.py "$slug" || { echo "FAILED: $slug"; failed=1; }
          done
          exit $failed

      - name: Commit data (or failure diagnostics) if output changed
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for d in data diagnostics; do [ -e "$d" ] && git add "$d"; done
          if git diff --cached --quiet; then
            echo "No data changes; nothing to commit."
          else
            git commit -m "Update extracts / diagnostics (run ${GITHUB_RUN_ID})"
            git push
          fi
